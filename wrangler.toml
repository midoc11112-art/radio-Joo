name = "radio-joo-proxy"
main = "index.js"
compatibility_date = "2024-01-01"

# جدولة الفحص التلقائي كل 6 ساعات
[triggers]
crons = ["0 */6 * * *"]

# يجب عليك تفعيل KV Namespace باسم RADIO_KV من لوحة تحكم Cloudflare أو وضع الـ ID هنا
# [[kv_namespaces]]
# binding = "RADIO_KV"
# id = "YOUR_KV_NAMESPACE_ID_HERE"