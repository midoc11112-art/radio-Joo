name = "radio-joo-gateway"
main = "src/worker.js"
compatibility_date = "2026-10-31"
compatibility_flags = ["nodejs_compat"]

[[containers]]
class_name = "FFmpegContainer"
image = "./Dockerfile"
max_instances = 3

[[durable_objects.bindings]]
name = "FFMPEG_CONTAINER"
class_name = "FFmpegContainer"

[[migrations]]
tag = "v1"
new_classes = ["FFmpegContainer"]
